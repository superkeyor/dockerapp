# Target: Linux ARM64 (aarch64, glibc), matching pi's Python 3.14.7.
# Only direct main/extra requirements from ez's pyproject.toml are pinned.
# Transitive dependencies are resolved automatically at installation time.
# Direct pins retain the previously selected versions; this is not a full lock.
