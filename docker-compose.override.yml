# ==============================================================================
# DOCKER COMPOSE OVERRIDE (DEVELOPMENT)
# ==============================================================================
# docker-compose.override.yml auto merged with docker-compose.yml by 'docker compose up -d'
# To avoid override (e.g. production), run explicitly 'docker compose -f docker-compose.yml up -d'
# ==============================================================================
services:
    dockerapp:
        # !override replaces the base ports (127.0.0.1:5000) instead of appending
        ports: !override
            # Open to all interfaces for local testing
            - "5000:5000"
        environment:
            - APP_ENV=development
        volumes:
            - ./app:/app  # Enable hot-reloading
    dockerapp_db:
        ports:
            - "5432:5432"  # Allows you to connect via DBeaver/PgAdmin locally
        volumes:
            - ./db:/var/lib/postgresql/data  # Local project folder
