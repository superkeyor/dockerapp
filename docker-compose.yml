services:
    dockerapp:
        image: dockerapp:latest
        container_name: dockerapp
        restart: always
        ports:
            - "127.0.0.1:5000:5000"
        # env_file -> loads every variable in the file into the container's environment
        # so os.environ["SECRET_KEY"] works without python-dotenv
        # .env is relative to this docker-compose.yml's folder (also when pulled in via include),
        # so no absolute path or ${HOME} needed (${HOME} may be `root` under sudo)
        env_file:
            - .env
        # environment -> wins over env_file if the same name is in both
        environment:
            - APP_ENV=production
        depends_on:
            - dockerapp_db
    dockerapp_db:
        image: postgres:18-alpine
        container_name: dockerapp_db
        restart: always
        # POSTGRES_USER and POSTGRES_PASSWORD come from .env
        env_file:
            - .env
        environment:
            POSTGRES_DB: dockerapp
        volumes:
            - /data/dockerapp/db:/var/lib/postgresql/data  # Production system path
